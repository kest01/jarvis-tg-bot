[project]
name = "jarvis-tg-bot"
version = "0.1.0"
description = "Personal Telegram AI assistant (routerai.ru)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "openai>=1.50",
    "sqlalchemy>=2.0,<3",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "freezegun>=1.5",
    "ruff>=0.6",
    "black>=24.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]
